<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<nav class="lcp-nav">
  <style>
    .lcp-nav { position:sticky; top:0; z-index:1000; display:flex; align-items:center; gap:4px;
               height:45px; padding:0 18px; background:rgba(11,16,32,.92);
               -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
               border-bottom:1px solid #26314f;
               font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lcp-nav .lcp-brand { color:#4cc2ff; font-size:12px; font-weight:800; letter-spacing:.08em;
                          text-transform:uppercase; margin-right:14px; white-space:nowrap; }
    .lcp-nav a { color:#8c98b7; text-decoration:none; font-size:13px; font-weight:600;
                 padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap; }
    .lcp-nav a:hover { color:#e8edf7; background:#141c31; border-color:#26314f; }
    .lcp-nav a.active { color:#4cc2ff; background:rgba(76,194,255,.1); border-color:rgba(76,194,255,.35); }
  </style>
  <span class="lcp-brand">LAN CP</span>
  <a href="/">Devices</a>
  <a href="/graph.html">Knowledge Graph</a>
  <a href="/wifi.html">Wi-Fi Scan</a>
  <a href="/routers.html">Router Audit</a>
  <script>
    (function(){
      var p = location.pathname;
      document.querySelectorAll('.lcp-nav a').forEach(function(a){
        var h = a.getAttribute('href');
        var isHome = (p === '/' || p === '/index.html');
        if ((h === '/' && isHome) || (h !== '/' && h === p)) a.classList.add('active');
      });
    })();
  </script>
</nav>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>LAN Control Plane</h1>
          <p class="sub">Home network inventory · 192.168.29.0/24</p>
        </div>
      </div>
      <div class="actions">
        <label class="toggle">
          <input type="checkbox" id="pingSweep" checked />
          <span>Ping sweep</span>
        </label>
        <button type="button" id="scanBtn" class="primary">Scan network</button>
      </div>
    </header>

    <section class="stats" id="stats">
      <div class="stat"><span class="label">Devices</span><span class="value" id="statCount">—</span></div>
      <div class="stat"><span class="label">Gateway</span><span class="value mono" id="statGateway">—</span></div>
      <div class="stat"><span class="label">This host</span><span class="value mono" id="statLocal">—</span></div>
      <div class="stat"><span class="label">Last scan</span><span class="value mono" id="statTime">never</span></div>
    </section>

    <p class="status" id="status" role="status"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Name</th>
            <th>IP</th>
            <th>MAC</th>
            <th>Hostname</th>
            <th>Room</th>
            <th>Tags</th>
            <th>Caps</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="empty"><td colspan="8">No scan yet. Hit Scan network.</td></tr>
        </tbody>
      </table>
    </div>

    <footer class="foot">
      Phase 1 · discovery + registry · adapters (Homey, RTSP) next
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
