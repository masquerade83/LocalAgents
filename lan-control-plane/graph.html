<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LAN Knowledge Graph</title>
<style>
  :root { --bg:#0b1020; --panel:#151d33; --border:#263050; --text:#e6ebf5; --muted:#8b97b5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; letter-spacing:-0.01em; }
  header .meta { color:var(--muted); font-size:12px; }
  header .legend { margin-left:auto; display:flex; gap:14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  header .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #wrap { display:flex; height:calc(100vh - 52px); }
  canvas { flex:1; display:block; cursor:grab; }
  #side { width:320px; border-left:1px solid var(--border); background:var(--panel); padding:16px; overflow:auto; }
  #side h2 { font-size:14px; margin:0 0 10px; }
  #side .empty { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:6px 0; border-bottom:1px solid var(--border); font-size:12px; vertical-align:top; }
  td:first-child { color:var(--muted); width:38%; }
  td:last-child { text-align:right; word-break:break-word; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .high { background:rgba(255,107,107,.15); color:#ff6b6b; }
  .ok { background:rgba(71,209,154,.15); color:#47d19a; }
  .btn { background:#1b2540; color:var(--text); border:1px solid var(--border); border-radius:8px;
         padding:7px 11px; font-size:12px; cursor:pointer; }
  .btn:hover { border-color:#4cc2ff; }
</style>
</head>
<body>
<nav class="lcp-nav">
  <style>
    .lcp-nav { position:sticky; top:0; z-index:1000; display:flex; align-items:center; gap:4px;
               height:45px; padding:0 18px; background:rgba(11,16,32,.92);
               -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
               border-bottom:1px solid #26314f;
               font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .lcp-nav .lcp-brand { color:#4cc2ff; font-size:12px; font-weight:800; letter-spacing:.08em;
                          text-transform:uppercase; margin-right:14px; white-space:nowrap; }
    .lcp-nav a { color:#8c98b7; text-decoration:none; font-size:13px; font-weight:600;
                 padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap; }
    .lcp-nav a:hover { color:#e8edf7; background:#141c31; border-color:#26314f; }
    .lcp-nav a.active { color:#4cc2ff; background:rgba(76,194,255,.1); border-color:rgba(76,194,255,.35); }
    /* account for the 45px nav so the canvas isn't clipped (body is overflow:hidden) */
    #wrap { height:calc(100vh - 52px - 45px); }
  </style>
  <span class="lcp-brand">LAN CP</span>
  <a href="/">Devices</a>
  <a href="/graph.html">Knowledge Graph</a>
  <a href="/wifi.html">Wi-Fi Scan</a>
  <a href="/routers.html">Router Audit</a>
  <script>
    (function(){
      var p = location.pathname;
      document.querySelectorAll('.lcp-nav a').forEach(function(a){
        var h = a.getAttribute('href');
        var isHome = (p === '/' || p === '/index.html');
        if ((h === '/' && isHome) || (h !== '/' && h === p)) a.classList.add('active');
      });
    })();
  </script>
</nav>
<header>
  <h1>◆ LAN Knowledge Graph</h1>
  <span class="meta" id="meta">loading…</span>
  <div class="legend">
    <span><i class="dot" style="background:#7c8cff"></i>Network</span>
    <span><i class="dot" style="background:#4cc2ff"></i>Router</span>
    <span><i class="dot" style="background:#47d19a"></i>Device</span>
    <span><i class="dot" style="background:#ffb454"></i>Service</span>
    <span><i class="dot" style="background:#c07cff"></i>Vendor</span>
    <span><i class="dot" style="background:#ff6b6b"></i>Finding</span>
  </div>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <aside id="side"><div class="empty">Click a node to inspect its properties. Drag to pan, scroll to zoom.</div></aside>
</div>
<script>
const COLORS = { Network:"#7c8cff", Device:"#47d19a", Service:"#ffb454", Vendor:"#c07cff", Finding:"#ff6b6b" };
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, DPR = window.devicePixelRatio || 1;
function resize(){ W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W*DPR; canvas.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener("resize", resize);

let nodes = [], edges = [], view = { x:0, y:0, k:1 }, hover = null, selected = null;

function color(n){
  if (n.label === "Device" && n.props.is_gateway) return COLORS.Network === n ? "" : "#4cc2ff";
  if (n.label === "Device" && n.props.device_type && n.props.device_type.includes("router")) return "#4cc2ff";
  return COLORS[n.label] || "#8b97b5";
}
function radius(n){ return n.label==="Network"?18 : n.label==="Device"?12 : n.label==="Finding"?9 : 7; }

fetch("./data/graph.json").then(r=>r.json()).then(g=>{
  document.getElementById("meta").textContent =
    `${g.subnet} · ${g.node_count} nodes · ${g.edge_count} edges · ${g.generated_from||""}`;
  resize();
  const idx = {};
  nodes = g.nodes.map((n,i)=>{
    const a = (i/g.nodes.length)*Math.PI*2;
    const o = { ...n, x: W/2 + Math.cos(a)*220 + (Math.random()-.5)*60,
                       y: H/2 + Math.sin(a)*220 + (Math.random()-.5)*60, vx:0, vy:0 };
    idx[n.id] = o; return o;
  });
  edges = g.edges.map(e=>({ ...e, a: idx[e.from], b: idx[e.to] })).filter(e=>e.a&&e.b);
  resize(); requestAnimationFrame(tick);
}).catch(e=>{ document.getElementById("meta").textContent = "failed to load ./data/graph.json — serve via the Flask app"; });

function simulate(){
  for (const n of nodes){
    for (const m of nodes){ if (n===m) continue;
      let dx=n.x-m.x, dy=n.y-m.y, d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2);
      const rep = 2600/d2; n.vx += (dx/d)*rep; n.vy += (dy/d)*rep;
    }
    n.vx += (W/2 - n.x)*0.0009; n.vy += (H/2 - n.y)*0.0009;
  }
  for (const e of edges){
    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.sqrt(dx*dx+dy*dy)+0.01;
    const target = e.type==="EXPOSES"?70 : e.type==="HAS_DEVICE"?150 : 120;
    const f=(d-target)*0.01;
    e.a.vx += (dx/d)*f; e.a.vy += (dy/d)*f; e.b.vx -= (dx/d)*f; e.b.vy -= (dy/d)*f;
  }
  for (const n of nodes){ if(n===dragging) continue; n.x+=n.vx*0.85; n.y+=n.vy*0.85; n.vx*=0.82; n.vy*=0.82; }
}
function T(n){ return { x:(n.x-view.x)*view.k + (1-view.k)*W/2, y:(n.y-view.y)*view.k + (1-view.k)*H/2 }; }

function tick(){
  simulate();
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth = 1;
  for (const e of edges){
    const a=T(e.a), b=T(e.b);
    ctx.strokeStyle = e.type==="HAS_FINDING" ? "rgba(255,107,107,.5)" : "rgba(120,140,190,.22)";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for (const n of nodes){
    const p=T(n), r=radius(n)*view.k;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle = color(n); ctx.fill();
    if (n===selected||n===hover){ ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke(); }
    const hasFinding = n.label==="Device" && edges.some(e=>e.a===n && e.type==="HAS_FINDING");
    if (hasFinding){ ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2.5; ctx.stroke(); }
    if (view.k>0.6 || n.label!=="Service"){
      ctx.fillStyle="#c9d3ea"; ctx.font=`${Math.max(10,11*view.k)}px system-ui`;
      ctx.textAlign="center";
      const label = n.props.nickname || n.props.hostname || n.props.ip || n.props.name ||
                    (n.props.port?(":"+n.props.port):"") || n.label;
      ctx.fillText(String(label).slice(0,22), p.x, p.y - r - 4);
    }
  }
  requestAnimationFrame(tick);
}

// ---- interaction ----
let dragging=null, panning=false, last={x:0,y:0};
function pick(mx,my){
  for (let i=nodes.length-1;i>=0;i--){ const p=T(nodes[i]); const r=radius(nodes[i])*view.k+4;
    if ((mx-p.x)**2 + (my-p.y)**2 <= r*r) return nodes[i]; }
  return null;
}
canvas.addEventListener("mousemove", ev=>{
  const mx=ev.offsetX, my=ev.offsetY;
  if (dragging){ dragging.x += (ev.movementX)/view.k; dragging.y += (ev.movementY)/view.k; return; }
  if (panning){ view.x -= ev.movementX/view.k; view.y -= ev.movementY/view.k; return; }
  hover = pick(mx,my); canvas.style.cursor = hover? "pointer":"grab";
});
canvas.addEventListener("mousedown", ev=>{
  const n = pick(ev.offsetX, ev.offsetY);
  if (n){ dragging=n; selected=n; renderSide(n); } else { panning=true; }
});
window.addEventListener("mouseup", ()=>{ dragging=null; panning=false; });
canvas.addEventListener("wheel", ev=>{ ev.preventDefault();
  view.k = Math.min(3, Math.max(0.3, view.k * (ev.deltaY<0?1.1:0.9))); }, {passive:false});

function renderSide(n){
  const side = document.getElementById("side");
  const rows = [];
  rows.push(["type", n.label]);
  for (const [k,v] of Object.entries(n.props)){
    if (k==="id"||v===""||v===null||(Array.isArray(v)&&!v.length)) continue;
    let val = Array.isArray(v)? v.join(", ") : String(v);
    if (k==="severity") val = `<span class="pill ${v==="high"?"high":"ok"}">${v}</span>`;
    rows.push([k, val]);
  }
  // related findings for a device
  const findings = edges.filter(e=>e.a===n && e.type==="HAS_FINDING").map(e=>e.b);
  let extra = "";
  if (findings.length){
    extra = "<h2 style='margin-top:16px'>Findings</h2>" + findings.map(f=>{
      const sev = f.props.severity||"info";
      return `<div style="margin-bottom:8px"><span class="pill ${sev==="high"?"high":"ok"}">${sev}</span>
              <div style="font-size:12px;color:#c9d3ea;margin-top:4px">${f.props.detail||""}</div></div>`;
    }).join("");
  }
  side.innerHTML = `<h2>${n.props.nickname||n.props.hostname||n.props.ip||n.props.name||n.label}</h2>
    <table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>${extra}`;
}
</script>
</body>
</html>
