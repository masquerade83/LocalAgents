<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Switch</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --green: #3dd68c;
      --red: #f07178;
      --accent: #6cb6ff;
      --master: #7c6cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e2a3a 0%, var(--bg) 55%);
      color: var(--text);
      padding: 2rem 1rem 3rem;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 650; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .master {
      background: linear-gradient(135deg, #252040 0%, var(--card) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .master-label { font-weight: 600; font-size: 1.05rem; }
    .master-hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
    .switch {
      position: relative;
      width: 56px;
      height: 32px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #3a4556;
      border-radius: 32px;
      cursor: pointer;
      transition: background 0.25s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 26px;
      width: 26px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    input:checked + .slider { background: var(--green); }
    input:checked + .slider.master-on { background: var(--master); }
    input:disabled + .slider { opacity: 0.45; cursor: wait; }
    input:checked + .slider::before { transform: translateX(24px); }
    .services { display: flex; flex-direction: column; gap: 0.65rem; }
    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(240,113,120,.4);
    }
    .dot.on {
      background: var(--green);
      box-shadow: 0 0 8px rgba(61,214,140,.45);
    }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; font-size: 0.95rem; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .meta a { color: var(--accent); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      background: #243044;
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .flow {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      border: 1px dashed var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }
    .refresh {
      margin-top: 1rem;
      width: 100%;
      padding: 0.65rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .refresh:hover { border-color: var(--accent); color: var(--text); }
    .observe {
      margin-top: 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    .observe h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 650;
    }
    .observe-meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.75rem; }
    .issue {
      background: rgba(240,113,120,.12);
      border: 1px solid rgba(240,113,120,.35);
      color: #ffb4b8;
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.78rem;
      margin-bottom: 0.45rem;
    }
    .ok-banner {
      background: rgba(61,214,140,.1);
      border: 1px solid rgba(61,214,140,.35);
      color: var(--green);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.78rem;
      margin-bottom: 0.45rem;
    }
    .vram-line { font-size: 0.82rem; margin-bottom: 0.65rem; }
    .route-list { list-style: none; padding: 0; margin: 0; }
    .route-list li {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.35rem 0;
      border-top: 1px solid var(--border);
      line-height: 1.45;
    }
    .route-list li:first-child { border-top: none; padding-top: 0; }
    .route-list strong { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hermes Switch</h1>
    <p class="sub">Telegram → Gateway → LiteLLM → Ollama · n8n</p>

    <div class="master">
      <div>
        <div class="master-label">Full stack</div>
        <div class="master-hint" id="masterHint">Start or stop the end-to-end flow</div>
      </div>
      <label class="switch" title="Master switch">
        <input type="checkbox" id="masterSwitch" />
        <span class="slider master-on"></span>
      </label>
    </div>

    <div class="services" id="services"></div>

    <button class="refresh" id="refreshBtn">Refresh status</button>

    <section class="observe" id="observePanel">
      <h2>Observability</h2>
      <div class="observe-meta" id="observeMeta">Loading stack snapshot…</div>
      <div id="observeIssues"></div>
      <div class="vram-line" id="observeVram"></div>
      <ul class="route-list" id="observeRoutes"></ul>
    </section>

    <div class="flow">
      Telegram @DhauladharBot → Hermes Gateway → LiteLLM :4000 → Ollama :11434<br />
      n8n :5678 · Grafana :3000 · Prometheus :9090<br />
      Stack health: <a href="http://127.0.0.1:5678/webhook/stack-health" target="_blank">webhook</a>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const ORDER = ["ollama", "ollama_inference_proxy", "postgres", "litellm", "router", "gateway", "n8n", "prometheus", "grafana", "ollama_exporter"];
    const CORE = ["litellm", "gateway"];
    let busy = false;
    let services = [];

    const toast = (msg) => {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2800);
    };

    const setBusy = (v) => {
      busy = v;
      document.querySelectorAll("input[type=checkbox]").forEach((i) => (i.disabled = v));
      document.getElementById("refreshBtn").disabled = v;
    };

    async function fetchStatus() {
      const r = await fetch("/api/status");
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "status failed");
      services = j.services.sort((a, b) => ORDER.indexOf(a.name) - ORDER.indexOf(b.name));
      render();
    }

    function renderObserve(j) {
      const meta = document.getElementById("observeMeta");
      const issuesEl = document.getElementById("observeIssues");
      const vramEl = document.getElementById("observeVram");
      const routesEl = document.getElementById("observeRoutes");

      meta.textContent = j.timestamp
        ? `Snapshot ${new Date(j.timestamp).toLocaleString()} · ${j.ok ? "healthy" : "issues detected"}`
        : "No snapshot";

      if (j.ok) {
        issuesEl.innerHTML = '<div class="ok-banner">Stack OK — no open issues</div>';
      } else {
        issuesEl.innerHTML = (j.issues || []).map((i) => `<div class="issue">${i}</div>`).join("")
          || '<div class="issue">Unknown issue</div>';
      }

      const vram = j.vram || {};
      const models = (vram.models || []).map((m) => `${m.name} (${m.vram_gb} GB)`).join(", ");
      vramEl.textContent = vram.ok
        ? `VRAM: ${vram.models_loaded} model(s), ${vram.total_vram_gb} GB${models ? " — " + models : ""}`
        : `VRAM: unavailable (${vram.error || "Ollama down"})`;

      const routes = (j.explainability?.recent_router_decisions || []).slice(-3);
      routesEl.innerHTML = routes.length
        ? routes.map((r) =>
            `<li><strong>${r.routed_model || r.out_model}</strong> ← ${r.requested_model || r.in_model || "?"} · ${r.reason} · ${r.latency_ms}ms</li>`
          ).join("")
        : "<li>No recent router decisions</li>";
    }

    async function fetchObserve() {
      try {
        const r = await fetch("/api/observe");
        const j = await r.json();
        if (!j.ok && j.error) throw new Error(j.error);
        renderObserve(j);
      } catch (e) {
        document.getElementById("observeMeta").textContent = `Observe failed: ${e}`;
      }
    }

    function render() {
      const box = document.getElementById("services");
      box.innerHTML = services.map((s) => {
        const link = s.url ? `<a href="${s.url}" target="_blank">:${s.port || ""} open</a>` : (s.port ? `:${s.port}` : s.detail);
        return `
          <div class="row" data-name="${s.name}">
            <div class="dot ${s.running ? "on" : ""}"></div>
            <div class="info">
              <div class="name">${s.title || s.name}</div>
              <div class="meta">${s.subtitle || ""} · ${link}</div>
            </div>
            <label class="switch">
              <input type="checkbox" data-svc="${s.name}" ${s.running ? "checked" : ""} />
              <span class="slider"></span>
            </label>
          </div>`;
      }).join("");

      box.querySelectorAll("input[data-svc]").forEach((inp) => {
        inp.addEventListener("change", (e) => onToggle(e.target.dataset.svc, e.target.checked, e.target));
      });

      const coreUp = CORE.every((n) => services.find((s) => s.name === n)?.running);
      const master = document.getElementById("masterSwitch");
      master.checked = coreUp;
      document.getElementById("masterHint").textContent = coreUp
        ? "Core flow is running"
        : "Core flow is stopped or starting…";
    }

    async function action(act, service) {
      setBusy(true);
      toast(`${act} ${service}…`);
      try {
        const r = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: act, service }),
        });
        const j = await r.json();
        services = j.services || services;
        render();
        if (!j.ok) toast(j.output || "Action failed");
        else toast(`${service} ${act} done`);
        setTimeout(fetchStatus, 2500);
      } catch (e) {
        toast(String(e));
      } finally {
        setBusy(false);
      }
    }

    async function onToggle(name, wantOn, input) {
      if (busy) return;
      const act = wantOn ? "start" : "stop";
      await action(act, name);
    }

    document.getElementById("masterSwitch").addEventListener("change", async (e) => {
      if (busy) return;
      const on = e.target.checked;
      await action(on ? "start" : "stop", "all");
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      if (!busy) {
        fetchStatus().catch((e) => toast(String(e)));
        fetchObserve();
      }
    });

    fetchStatus().catch((e) => toast(String(e)));
    fetchObserve();
    setInterval(() => {
      if (!busy) {
        fetchStatus().catch(() => {});
        fetchObserve();
      }
    }, 8000);
  </script>
</body>
</html>
